<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKA Smart Exam - Media Latihan Tes Kemampuan Akademik SD</title>
    <meta name="description" content="Aplikasi CBT latihan Ujian Tes Kemampuan Akademik (TKA) untuk siswa SD Kelas 2 sampai 6. Lengkap dengan Timer, Mode Latihan & Simulasi, serta Pembahasan.">
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        cbt: {
                            green: '#10b981',
                            greenHover: '#059669',
                            yellow: '#f59e0b',
                            yellowHover: '#d97706',
                            gray: '#6b7280',
                            grayLight: '#f3f4f6',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Libraries for Export (SheetJS & jsPDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Global Toast / Alert Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Main Navigation Bar -->
    <div id="navbar-container"></div>

    <!-- Main Application View Container -->
    <main id="app-view" class="flex-grow flex flex-col"></main>

    <!-- Global Modal Overlay Container -->
    <div id="modal-container" class="relative z-40"></div>

    <!-- Application Script Bundles -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
